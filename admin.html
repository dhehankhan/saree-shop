<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যাডমিন প্যানেল</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f4f1ec;color:#222;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;padding:20px}
.w{max-width:760px;margin:auto}.box{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
h2{margin:0 0 14px}label{display:block;margin:12px 0 5px;font-weight:600;font-size:.95rem}
input,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}
button{padding:11px 20px;border:0;border-radius:9px;background:#b3262e;color:#fff;font:inherit;font-weight:600;cursor:pointer;margin-top:16px}
button.g{background:#666;margin:0 0 0 8px;padding:7px 12px}button.x{background:#999;margin:0;padding:6px 12px}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row img{width:54px;height:72px;object-fit:cover;border-radius:8px}.row div{flex:1}
#msg{margin-top:10px;font-weight:600}a{color:#b3262e}.hide{display:none}
</style></head><body><div class="w">
<div id="login" class="box"><h2>অ্যাডমিন লগইন</h2>
<label>ইমেইল</label><input id="em" type="email"><label>পাসওয়ার্ড</label><input id="pw" type="password">
<button id="lb">লগইন</button><div id="lm" style="color:#b3262e;margin-top:10px"></div></div>
<div id="panel" class="hide">
<div class="box"><h2>নতুন শাড়ি যোগ করুন <button class="g" id="out">লগআউট</button></h2>
<label>শাড়ির নাম</label><input id="ti">
<label>বিবরণ (ভিডিওর বাম পাশে নিচে দেখাবে)</label><textarea id="de" rows="3"></textarea>
<label>ছবি (কার্ডে দেখাবে)</label><input id="im" type="file" accept="image/*">
<label>ভিডিও (পুরো স্ক্রিনে চলবে)</label><input id="vi" type="file" accept="video/mp4,video/webm">
<button id="add">যোগ করুন</button><div id="msg"></div></div>
<div class="box"><h2>দোকানের সেটিংস</h2>
<label>দোকানের নাম</label><input id="sn"><label>WhatsApp নম্বর</label><input id="sw" inputmode="tel">
<button id="ss">সেভ করুন</button><span id="sm" style="margin-left:10px;font-weight:600"></span></div>
<div class="box"><h2>সব শাড়ি</h2><div id="list"></div></div>
<p><a href="index.html">← ওয়েবসাইট দেখুন</a></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=i=>document.getElementById(i);
async function gate(){const {data}=await sb.auth.getSession();const on=!!data.session;
  $('login').classList.toggle('hide',on);$('panel').classList.toggle('hide',!on);if(on){load();loadSt()}}
$('lb').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error)$('lm').textContent='ইমেইল বা পাসওয়ার্ড ভুল।';else gate()};
$('out').onclick=async()=>{await sb.auth.signOut();gate()};
async function up(f){const p=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+f.name.split('.').pop();
  const {error}=await sb.storage.from('media').upload(p,f,{contentType:f.type});if(error)throw error;
  return sb.storage.from('media').getPublicUrl(p).data.publicUrl}
$('add').onclick=async()=>{const m=$('msg'),t=$('ti').value.trim(),im=$('im').files[0],vi=$('vi').files[0];
  if(!t||!im||!vi){m.textContent='নাম, ছবি ও ভিডিও — তিনটিই দিন।';return}
  m.textContent='আপলোড হচ্ছে… একটু অপেক্ষা করুন।';$('add').disabled=true;
  try{const [iu,vu]=[await up(im),await up(vi)];
    const {data}=await sb.from('sarees').select('sort').order('sort',{ascending:false}).limit(1);
    const {error}=await sb.from('sarees').insert({title:t,description:$('de').value,image_url:iu,video_url:vu,sort:(data?.[0]?.sort??0)+1});
    if(error)throw error;m.textContent='✔ যোগ হয়েছে!';['ti','de','im','vi'].forEach(i=>$(i).value='');load()
  }catch(e){m.textContent='ত্রুটি: '+e.message}$('add').disabled=false};
async function load(){const {data}=await sb.from('sarees').select('*').order('sort').order('id');
  $('list').innerHTML=data?.length?'':'কিছু নেই।';
  (data||[]).forEach(s=>{const r=document.createElement('div');r.className='row';
    r.innerHTML=`<img src="${s.image_url}"><div><b></b></div><button class="x">মুছুন</button>`;
    r.querySelector('b').textContent=s.title;
    r.querySelector('button').onclick=async()=>{if(confirm('মুছে ফেলবেন?')){await sb.from('sarees').delete().eq('id',s.id);load()}};
    $('list').appendChild(r)})}
$('ss').onclick=async()=>{const {error}=await sb.from('settings').upsert([{key:'shop_name',value:$('sn').value},{key:'whatsapp',value:$('sw').value}]);
  $('sm').textContent=error?'ত্রুটি: '+error.message:'✔ সেভ হয়েছে'};
async function loadSt(){const {data}=await sb.from('settings').select('*');(data||[]).forEach(r=>{if(r.key==='shop_name')$('sn').value=r.value;if(r.key==='whatsapp')$('sw').value=r.value})}
gate();
</script></body></html>
